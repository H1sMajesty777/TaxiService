spring:
  application:
    name: taxi-backend
  datasource:
    url: ${TAXI_DB_URL:jdbc:postgresql://127.0.0.1:5434/taxi}
    username: ${TAXI_DB_USER:taxi}
    password: ${TAXI_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  servlet:
    multipart:
      max-file-size: 512KB
      max-request-size: 600KB
server:
  port: ${APP_PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints.web.exposure.include: health
springdoc:
  swagger-ui.path: /swagger-ui.html
taxi:
  jwt-secret: ${TAXI_JWT_SECRET:}
  admin-email: ${TAXI_ADMIN_EMAIL:admin@taxi.example}
  admin-password: ${TAXI_ADMIN_PASSWORD:}
  secure-cookie: ${TAXI_SECURE_COOKIE:false}
