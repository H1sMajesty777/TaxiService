plugins {
    id 'com.android.application'
}

def localBackend = providers.gradleProperty('taxiDebugUrl').orElse('http://10.0.2.2:8081/').get()
def releaseBackend = providers.gradleProperty('taxiReleaseUrl').orElse('https://taxi.example.invalid/').get()
def backendUrl = { String url, boolean release ->
    def parsed = URI.create(url)
    if (!url.endsWith('/') || !parsed.host || parsed.userInfo || parsed.query || parsed.fragment ||
            (release ? parsed.scheme != 'https' : !(parsed.scheme in ['http', 'https']))) {
        throw new GradleException("Некорректный адрес backend: требуется URL, оканчивающийся на /")
    }
    return '"' + url + '"'
}

android {
    namespace 'ru.mirea.taxi.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.mirea.taxi.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BASE_URL', backendUrl(localBackend, false)
        }
        release {
            buildConfigField 'String', 'BASE_URL', backendUrl(releaseBackend, true)
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
